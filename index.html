<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <link rel="icon" href="data:," />
    <style>
      /* Ticket-02 palette: UI text #F5F1E6, danger #FF5A5F, gold/score #F2C14E, night #0E1430 */
      /* Ticket-04: every UI font >= 18 px at 1280x720; --fs = 1.25 with "Chữ lớn" */
      :root { --text: #f5f1e6; --danger: #ff5a5f; --gold: #f2c14e; --night: #0e1430; --amber: #ffb347; --shade: #7a3cff; --fs: 1; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--text); font-family: system-ui, sans-serif; font-size: calc(18px * var(--fs)); }
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000; }
      #hud[hidden], #overlay[hidden] { display: none; }
      #flames { position: absolute; top: 14px; left: 16px; font-size: calc(26px * var(--fs)); letter-spacing: 4px; }
      #flames .off { opacity: 0.25; filter: grayscale(1); }
      #clock { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: calc(30px * var(--fs)); font-variant-numeric: tabular-nums; font-weight: 600; }
      #clock.danger { color: var(--danger); animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      #right { position: absolute; top: 14px; right: 16px; text-align: right; font-size: calc(18px * var(--fs)); line-height: 1.5; }
      #score { color: var(--gold); font-weight: 600; }
      #bar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
      #bar i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ffe58a80; background: #0006; }
      #bar b { align-self: center; margin-left: 8px; font-size: calc(18px * var(--fs)); }
      #bar i.on { background: radial-gradient(#fff6c2, #ffe58a 60%, #ffb347); box-shadow: 0 0 8px #ffe58a; }
      #cds { position: absolute; bottom: 14px; right: 16px; display: flex; gap: 10px; }
      .cd { position: relative; min-width: calc(64px * var(--fs)); height: calc(64px * var(--fs)); padding: 0 4px; box-sizing: border-box; border-radius: 10px; background: #0e1430c0; border: 2px solid var(--gold); display: grid; place-items: center; font-size: calc(18px * var(--fs)); overflow: hidden; }
      .cd b { position: absolute; left: 0; right: 0; bottom: 0; background: #000a; }
      .cd span { position: relative; text-align: center; line-height: 1.1; }
      .cd.charmed { border-color: #c8102e; box-shadow: 0 0 10px #c8102e; }
      #prompt { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: calc(18px * var(--fs)); padding: 4px 12px; border-radius: 8px; background: #0e1430c0; }
      #prompt:empty { display: none; }
      #arrow, #sarrow { position: absolute; width: 0; height: 0; font-size: calc(34px * var(--fs)); color: var(--amber); }
      #sarrow { color: var(--shade); filter: drop-shadow(0 0 4px #fff8); }
      #arrow span, #sarrow span { position: absolute; transform: translate(-50%, -50%); display: block; }
      #arrow[data-kind=mote] { color: #ffe58a; }
      #arrow[data-kind=refuel] { color: var(--danger); }
      #arrow em { position: absolute; top: calc(22px * var(--fs)); transform: translateX(-50%); white-space: nowrap; font-style: normal; font-size: calc(18px * var(--fs)); padding: 1px 8px; border-radius: 8px; background: #0e1430c0; color: var(--text); }
      #arrow[data-kind=refuel] em { border: 2px solid var(--danger); }
      #wind { position: absolute; top: calc(60px * var(--fs)); left: 50%; transform: translateX(-50%); font-size: calc(18px * var(--fs)); color: #c9e6a8; }
      #wind:empty { display: none; }
      #captions { position: absolute; top: calc(96px * var(--fs)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
      #captions div { font-size: calc(20px * var(--fs)); padding: 4px 14px; border-radius: 8px; background: #000c; }
      #help { position: absolute; top: calc(56px * var(--fs)); left: 16px; max-width: 360px; font-size: calc(18px * var(--fs)); line-height: 1.35; opacity: 0.8; }
      #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #flash.go { animation: flash 0.35s ease-out; }
      @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
      .reduce-motion #flash { display: none; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #0e1430c8; }
      .panel { max-width: 640px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; padding: 24px 36px; border-radius: 16px; background: #1b2350e8; border: 2px solid var(--gold); text-align: center; }
      .panel h1 { font-size: calc(44px * var(--fs)); margin: 0 0 6px; color: var(--amber); }
      .panel h2 { font-size: calc(28px * var(--fs)); margin: 0 0 10px; color: var(--amber); }
      .panel p { line-height: 1.5; margin: 10px 0; }
      .panel .dang { font-style: italic; }
      .panel button { display: block; width: 100%; margin: 10px 0 0; padding: 10px; font-size: calc(18px * var(--fs)); border-radius: 10px; border: 2px solid var(--gold); background: #0e1430; color: var(--text); cursor: pointer; }
      .panel button:hover, .panel button:focus-visible { background: #2a2f5c; outline: 3px solid var(--amber); outline-offset: 1px; }
      .panel input[type=checkbox] { width: 22px; height: 22px; justify-self: start; }
      .panel label { display: grid; grid-template-columns: minmax(180px, 1fr) 1fr 48px; align-items: center; gap: 10px; margin: 10px 0; text-align: left; }
      .panel label.name { grid-template-columns: auto 1fr; }
      .panel input[type=text] { font-size: calc(18px * var(--fs)); padding: 8px; border-radius: 8px; border: 2px solid var(--gold); background: #0e1430; color: var(--text); }
      .panel button.key { margin: 0; padding: 6px; }
      .panel button.key.clash { border-color: var(--danger); color: var(--danger); }
      .warn { color: var(--danger); font-weight: 600; }
      .panel table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .panel th, .panel td { padding: 4px 8px; border-bottom: 1px solid #f2c14e40; text-align: left; }
      .panel tr.me td { color: var(--gold); font-weight: 700; }
      .big { font-size: calc(34px * var(--fs)); color: var(--gold); font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="hud" hidden>
      <div id="flames"></div>
      <div id="help"></div>
      <div id="clock"></div>
      <div id="right"><div id="lanterns"></div><div id="score"></div></div>
      <div id="wind" role="status"></div>
      <div id="captions" aria-live="polite"></div>
      <div id="prompt"></div>
      <div id="bar"></div>
      <div id="cds">
        <div class="cd" id="cd-dash"><b></b><span>Lướt<br />Shift</span></div>
        <div class="cd" id="cd-pulse"><b></b><span>Tỏa<br />F</span></div>
      </div>
      <div id="arrow" data-kind="light"><span>➤</span><em id="arrow-label"></em></div>
      <div id="sarrow" aria-hidden="true"><span>➤</span></div>
    </div>
    <div id="flash"></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
